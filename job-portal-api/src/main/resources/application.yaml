server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: job-portal-api

  datasource:
    url: jdbc:mysql://localhost:3306/job_portal_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Lalwani@8090}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# Custom Security & App Properties
app:
  jwt:
    # 256-bit Hex secret key from environment variable
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 Hours
  upload:
    dir: ${UPLOAD_DIR:./uploads/resumes}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:dummy-key}
      base-url: https://generativelanguage.googleapis.com/v1beta
      model: gemini-1.5-flash

